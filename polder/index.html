      deep:"Maastricht held the rotating presidency at the right moment, and its position on the border made the symbolism convenient. The treaty established European citizenship, the three-pillar structure, and the convergence criteria that member states still argue about. Ratification was nearly derailed when Danish voters rejected it, which is why the word Maastricht appears in political arguments across the continent to this day."},
    {tag:"place", place:"maastricht", text:"When the Netherlands had to hide Rembrandt's Night Watch from the Germans, it went into a marl cave in Limburg &mdash; rolled off its frame and stored in a climate-controlled bunker inside a hill quarried since Roman times.",
      deep:"The Sint-Pietersberg caves are a man-made maze of hundreds of kilometres of galleries cut for building stone, with a stable temperature and humidity that happen to suit paintings. A purpose-built shelter was constructed inside. The same tunnels have sheltered civilians in several wars, hold centuries of charcoal graffiti, and are cold enough that guides warn visitors to bring a coat in August."},
    {tag:"place", place:"maastricht", text:"The highest point in the European Netherlands is a 322-metre hill where three countries meet, so you can stand in the Netherlands, Belgium and Germany within a few paces and then queue for a pancake.",
      deep:"The Vaalserberg only became the national high point in 1962, when Dutch New Guinea and its real mountains left Dutch sovereignty. Until 1919 the same spot was a four-country point, thanks to Neutral Moresnet, a disputed zinc-mining territory that had no clear owner and briefly attracted a scheme to make it an Esperanto-speaking state."},
    {tag:"place", place:"maastricht", text:"Maastricht's name means Meuse crossing. It marks the point where a Roman road forded the river, and the city has been a crossing, a garrison and a border town ever since, besieged more than twenty times.",
      deep:"Its strategic value made it one of the most heavily fortified places in Europe, with layers of walls, bastions and underground tunnels dug so defenders could mine beneath attackers. The fortifications were dismantled in the 19th century once they were militarily obsolete, but long stretches survive as city park. Being fought over so often is also why the city's culture faces south rather than north."},
    {tag:"place", place:"maastricht", text:"Limburg was a coal region until the mines were shut in the 1960s and 70s, closed deliberately and quickly after the Groningen gas field made them uneconomic, which is why a Dutch province has a rust belt.",
      deep:"Around 45,000 jobs went in about a decade. The government promised replacement industry and the transition was rougher than advertised, leaving long-term unemployment and a sense of having been sacrificed to a national windfall found elsewhere. Former shaft sites are now business parks and a museum, and the regional identity still carries the mines as a reference point."},

    // --- Zeeland ---
    {tag:"place", place:"zeeland", text:"The storm surge barrier across the Eastern Scheldt was supposed to be a solid dam. Protests over the loss of a tidal ecosystem forced a redesign into sixty-two vast gates that stay open most of the time and close only in a storm.",
      deep:"The original plan would have killed the salt marsh, the oyster beds and the fishery. Fishermen and environmentalists pushed a compromise that cost far more and took far longer: piers sunk onto prepared mattresses on the seabed, with steel gates lowered between them. It is the point where Dutch water engineering stopped treating the sea purely as an enemy to be excluded."},
    {tag:"place", place:"zeeland", text:"Zeeland took the worst of the 1953 flood. The sea came through the dikes at night across the islands, and the response is that the province now lives behind the largest flood defence system ever built.",
      deep:"Whole villages were cut off for days, rescue came by small boat, and some areas stayed under water for months. The Delta Works that followed closed off estuaries, shortened the coastline by hundreds of kilometres and raised standards everywhere. A memorial museum sits in a caisson used to plug the final breach, which is an unusually direct way to house the story of a disaster."},
    {tag:"place", place:"zeeland", text:"The first known patent application for a telescope was filed in Middelburg in 1608 by a local spectacle maker, and it was refused on the grounds that the device was too easy to copy.",
      deep:"Hans Lippershey demonstrated an instrument that made distant things appear near, and the States General declined the monopoly while paying him to build binocular versions. Word reached Italy within months, where Galileo built his own and pointed it at Jupiter. Two other claimants in the same small town muddied the credit, which is roughly what happens when an idea is ready to be had."},
    {tag:"place", place:"zeeland", text:"There is a drowned village under the tidal marsh at Saeftinghe. A flood in 1570 took the land, the sea kept it, and local legend blames the inhabitants' arrogance rather than the dikes.",
      deep:"The Drowned Land of Saeftinghe is now a large brackish marsh cut by creeks, crossed only with a licensed guide because the channels fill fast and the mud holds. The story of the rich village punished for its pride is the kind of moral narrative that tends to attach to Dutch flood events, where the engineering explanation and the folk explanation have coexisted for centuries."},
    {tag:"place", place:"zeeland", text:"Most Dutch oysters and mussels come through one small Zeeland town, where shellfish from several countries are relaid in the local tidal water to clean and finish before sale.",
      deep:"Yerseke sits on the Eastern Scheldt, and the barrier that kept the estuary tidal is precisely what keeps the industry alive. Mussels are grown on the seabed, dredged, then held in <em>mosselpercelen</em>, leased plots of water, to purge sand. The trade runs on an auction and a strict seasonal opening, and the Dutch argue with the Belgians every year about who eats them properly."},

    // --- Friesland ---
    {tag:"place", place:"friesland", text:"Friesland has its own official language, and it is the closest living relative of English. The old test phrase &ldquo;bread, butter and green cheese is good English and good Fries&rdquo; is nearly identical in both.",
      deep:"Frisian is used in schools, courts and local government, and the province's official name is Frysl&acirc;n. It shares sound changes with English that Dutch never made, which is why some words look uncannily familiar to an English reader and not at all familiar to a Dutch one. Roughly half a million speakers remain, and the language has its own literature and broadcaster."},
    {tag:"place", place:"friesland", text:"The Netherlands has a 200-kilometre ice skating race across eleven Frisian cities that can only be held when the natural ice is thick enough everywhere. It has run fifteen times in a century and not once since 1997.",
      deep:"The Elfstedentocht needs at least fifteen centimetres of ice along the whole route, judged by inspectors walking it. When conditions look possible the country enters a state of collective anticipation, with newsreaders discussing ice thickness and employers braced for absence. Warmer winters have made it increasingly unlikely, which has turned the race into a kind of national climate indicator."},
    {tag:"place", place:"friesland", text:"Frisians compete at vaulting over canals with a pole. You sprint at a pole standing in the water, climb it while it falls, and try to land on the far bank; the record is over twenty-two metres.",
      deep:"<em>Fierljeppen</em> began as a practical way for farmers to cross ditches and became a codified sport with leagues, national championships and specialised carbon poles up to thirteen metres long. The skill is in climbing fast enough while the pole tips, which is why competitors are typically light, tall and unafraid. Failed attempts end in the canal, on camera, which is part of the appeal."},
    {tag:"place", place:"friesland", text:"The black and white dairy cow that dominates milk production worldwide is Frisian. The Holstein-Friesian was bred on these clay pastures and exported so successfully that it is now the default cow on several continents.",
      deep:"Centuries of selection on rich reclaimed grassland produced an animal that converts grass into an exceptional volume of milk. Dutch and German breeders kept herd books, and American breeding later pushed yields further still. The Frisian horse, a heavy black riding and carriage breed, comes from the same province and nearly died out in the 20th century before being deliberately rebuilt."},
    {tag:"place", place:"friesland", text:"Frisians spent centuries insisting they had no lord. The tradition of Frisian Freedom held that they answered to the emperor directly and to no count in between, and it shaped a province of villages and mounds rather than castles.",
      deep:"The claim rested on a supposed privilege from Charlemagne and functioned as a working political arrangement for a long period, with local assemblies and elected judges instead of feudal hierarchy. It also meant no strong central authority when neighbours arrived with one. The absence of castles in the Frisian landscape, compared with the rest of the country, is the physical trace of it."},

    // --- Groningen ---
    {tag:"place", place:"groningen", text:"Under Groningen lies one of the largest natural gas fields ever found. It paid for decades of Dutch welfare spending, gave economics the term Dutch disease, and caused earthquakes that cracked thousands of houses.",
      deep:"Discovered in 1959, the field made the country rich and its currency strong enough to damage other exports, which is what Dutch disease names. Extraction also caused the ground to subside and the rock to slip, producing shallow tremors that broke homes never built for seismic loads. After years of damage claims, protest and a parliamentary inquiry that found residents had been treated shamefully, production was ended."},
    {tag:"place", place:"groningen", text:"Before dikes existed, people here lived on artificial hills. Villages in the northern clay were built on <em>wierden</em>, mounds raised by hand over generations to keep houses, livestock and the church above the tide.",
      deep:"Each mound grew as inhabitants added earth, dung and rubbish, so a cross-section is a stratigraphy of the settlement's own life, sometimes several metres deep and centuries old. Many are still visible as villages standing improbably above flat fields, with the church at the summit. They are the oldest Dutch answer to water: not keeping it out, but getting above it."},
    {tag:"place", place:"groningen", text:"Groningen is one of the youngest cities in Europe by average age, because a university of some 35,000 students sits in a city of around 230,000 people and empties out every summer.",
      deep:"The university was founded in 1614, making it among the oldest in the country, and the student population has shaped the housing market, the nightlife and the politics. The effect is visible in the demographics: the city's average age is markedly lower than the national one, and its population turns over constantly as one cohort graduates and another arrives in September."},
    {tag:"place", place:"groningen", text:"Groningen rebuilt its street network in 1977 to make driving across the centre impossible. The plan was pushed through overnight, generated furious protest, and turned the city into the most-cycled in the Netherlands.",
      deep:"The traffic circulation plan divided the centre into sectors that cars could enter but not cross, forcing drivers back out to a ring road while bikes went straight through. Shopkeepers predicted ruin and some sued. Around six in ten trips in the city are now made by bicycle, one of the highest shares anywhere, and planners from other countries visit specifically to study what was done."},
    {tag:"place", place:"groningen", text:"The tower over Groningen's main square has been struck by lightning, burned, and rebuilt repeatedly, and the city bought it from the church in the 1590s &mdash; so the bell tower belongs to the municipality, not the parish.",
      deep:"The Martinitoren is about 97 metres tall and was intended to be higher before the money and structural confidence ran out. Municipal ownership made sense when the tower doubled as a lookout for fires and approaching armies. Its carillon is played by a city carillonneur, and the climb up passes the bell chamber, which is an unnerving place to be near the hour."},

    // --- De Wadden ---
    {tag:"place", place:"wadden", text:"The Wadden Sea is the largest unbroken system of intertidal sand and mud flats in the world, and twice a day a substantial part of it stops being sea at all and becomes walkable ground.",
      deep:"The flats stretch along the coast from the Netherlands through Germany to Denmark and are UNESCO listed as a natural site. The tidal cycle exposes enormous feeding grounds that make the area critical for migratory birds: millions use it as a refuelling stop between Africa and the Arctic. The whole system moves, with channels shifting position year on year."},
    {tag:"place", place:"wadden", text:"You can legally walk from the mainland to the islands across the seabed, with a licensed guide, timing the crossing against the tide. Going without one is both illegal in places and a reliable way to require rescue.",
      deep:"<em>Wadlopen</em> means hours of wading through mud and chest-deep channels, navigating by compass and knowledge of where the gullies run. Guides are certified, weather calls are absolute, and the return is not an option once the tide turns. The reward is standing on the floor of the North Sea with no land in sight, listening to birds, an hour from the nearest road."},
    {tag:"place", place:"wadden", text:"The last fighting in Europe in the Second World War happened on a Dutch island, and it continued for two weeks after the German surrender. Georgian soldiers on Texel rose against their German officers and the battle ran on to 20 May 1945.",
      deep:"The Georgians were prisoners of war pressed into German service who revolted in April 1945 hoping the Allies would land. No landing came. Germans retook the island in brutal fighting; hundreds of Georgians, Germans and Dutch islanders died, and farms were burned. Canadian troops only arrived after the general surrender, which is why the episode is sometimes called Europe's last battle."},
    {tag:"place", place:"wadden", text:"The Texel sheep is one of the world's most widely used meat breeds, exported from a single Dutch island to farms across Europe, the Americas and New Zealand, where it is crossed into local flocks for the muscling.",
      deep:"The island's salt-influenced pasture and long isolation produced a stocky animal with an exceptional meat-to-bone ratio. Lambs on Texel outnumber people in spring. The local product sold as salt-meadow lamb comes from grazing on ground washed by seawater, which is claimed to season the meat from the inside, a claim nobody on the island is inclined to examine too closely."},
    {tag:"place", place:"wadden", text:"Two of the Dutch Wadden islands have no inhabitants and no visitors. Rottumerplaat and Rottumeroog are left to the birds and the sand, with access forbidden and the coastline allowed to move as it likes.",
      deep:"For years a warden was posted to Rottumerplaat each summer, a job so isolated that the writer Jan Wolkers took it and produced a diary of the experience. The practice has largely ended and the islands are now monitored remotely. They are among the very few places in a crowded country where the policy is explicitly to do nothing and see what happens."}
  ];

  FACTS.forEach(function(f, i){ f.id = i; });

  // Curated facts carry numeric ids; ones Claude writes later carry string ids.
  var genFacts = [];
  var ALL = FACTS.slice();
  var factById = {};
  function reindex(){
    ALL = FACTS.concat(genFacts);
    factById = {};
    ALL.forEach(function(f){ factById[f.id] = f; });
  }
  reindex();

  var KEPT_KEY = "polder-almanac-kept";
  var SEEN_KEY = "polder-almanac-seen";
  var FILTER_KEY = "polder-almanac-filter";
  var GEN_KEY = "polder-almanac-written";
  var PLACES_KEY = "polder-almanac-places";

  function validId(n){
    return Number.isInteger(n) || (typeof n === "string" && n.length > 0);
  }
  function readLocal(key){
    try{
      var raw = window.localStorage.getItem(key);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(validId) : [];
    } catch(e){ return []; }
  }
  function readJsonLocal(key){
    try{
      var raw = window.localStorage.getItem(key);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch(e){ return []; }
  }
  function writeLocal(key, value){
    try{ window.localStorage.setItem(key, JSON.stringify(value)); } catch(e){ /* private mode: stay in memory */ }
  }

  // Generated text is rendered as HTML, so allow only the markup this page uses.
  function safeHtml(s){
    var out = String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    out = out.replace(/&lt;em&gt;/g, "<em>").replace(/&lt;\/em&gt;/g, "</em>");
    out = out.replace(/&amp;(mdash|ndash|ldquo|rdquo|lsquo|rsquo|hellip|nbsp|numero);/g, "&$1;");
    return out;
  }

  var keptIds = readLocal(KEPT_KEY);
  var seenIds = readLocal(SEEN_KEY);

  var docs = { kept:null, seen:null };
  var writeState = { kept:{busy:false,queued:false}, seen:{busy:false,queued:false} };

  function push(which){
    var ref = docs[which];
    if(!ref) return;
    var st = writeState[which];
    if(st.busy){ st.queued = true; return; }
    st.busy = true;
    ref.set({ ids: (which === "kept" ? keptIds : seenIds).slice() })["catch"](function(){})
      .then(function(){
        st.busy = false;
        if(st.queued){ st.queued = false; push(which); }
      });
  }
  function saveKept(){ writeLocal(KEPT_KEY, keptIds); push("kept"); }

  var seenTimer = null;
  function saveSeen(immediate){
    writeLocal(SEEN_KEY, seenIds);
    if(seenTimer){ clearTimeout(seenTimer); seenTimer = null; }
    if(immediate){ push("seen"); return; }
    seenTimer = setTimeout(function(){ seenTimer = null; push("seen"); }, 1200);
  }

  var factEl = document.getElementById("fact");
  var placeTag = document.getElementById("placeTag");
  var indexTag = document.getElementById("indexTag");
  var freshTag = document.getElementById("freshTag");
  var btn = document.getElementById("nextBtn");
  var backBtn = document.getElementById("backBtn");
  var fwdBtn = document.getElementById("fwdBtn");
  var keepBtn = document.getElementById("keepBtn");
  var keepLabel = document.getElementById("keepLabel");
  var storyBtn = document.getElementById("storyBtn");
  var storyLabel = document.getElementById("storyLabel");
  var deepWrap = document.getElementById("deepWrap");
  var deepText = document.getElementById("deepText");
  var savedToggle = document.getElementById("savedToggle");
  var savedPanel = document.getElementById("savedPanel");
  var savedList = document.getElementById("savedList");
  var chipsEl = document.getElementById("chips");
  var progressEl = document.getElementById("progress");
  var exhaustedEl = document.getElementById("exhausted");
  var exhaustedText = document.getElementById("exhaustedText");
  var resetBtn = document.getElementById("resetBtn");
  var retryBtn = document.getElementById("retryBtn");
  var addPlaceForm = document.getElementById("addPlaceForm");
  var addPlaceInput = document.getElementById("addPlaceInput");
  var addNote = document.getElementById("addNote");
  var removePlaceBtn = document.getElementById("removePlaceBtn");
  var corpusCount = document.getElementById("corpusCount");

  var current = null;

  var BASE_PLACES = PLACES;
  var customPlaces = readJsonLocal(PLACES_KEY).filter(function(p){
    return p && typeof p.key === "string" && typeof p.name === "string";
  });

  var placeByKey = {};
  var CHIPS = [];
  function rebuildPlaces(){
    PLACES = BASE_PLACES.concat(customPlaces);
    placeByKey = {};
    PLACES.forEach(function(p){ placeByKey[p.key] = p; });
    CHIPS = [{key:null, name:"Everything", sub:"All"}].concat(PLACES);
  }
  rebuildPlaces();

  var storedFilter = null;
  try{ storedFilter = window.localStorage.getItem(FILTER_KEY); } catch(e){ storedFilter = null; }

  var filter = null;
  function validFilter(key){
    if(!key) return false;
    for(var i=0;i<CHIPS.length;i++){
      if(CHIPS[i].key && CHIPS[i].key === key) return true;
    }
    return false;
  }
  if(validFilter(storedFilter)){ filter = storedFilter; }

  function inPool(f){
    if(!filter) return true;
    return f.place === filter;
  }
  function poolFacts(){ return ALL.filter(inPool); }
  function unseenFacts(){
    return poolFacts().filter(function(f){ return seenIds.indexOf(f.id) === -1; });
  }
  function unseenCountFor(key){
    var n = 0;
    for(var i=0;i<ALL.length;i++){
      var f = ALL[i];
      if((key === null || f.place === key) && seenIds.indexOf(f.id) === -1){ n++; }
    }
    return n;
  }
  function filterLabel(){
    if(!filter) return "the whole almanac";
    var p = placeByKey[filter];
    return p ? p.name : "this set";
  }

  // ---- New facts, written by Claude when a set runs dry ----
  var sampleFn = null;
  var samplingOff = false;
  var genCollection = null;
  var genBusy = {};
  var genFailed = {};
  var dbBatches = [];
  var localBatches = readJsonLocal(GEN_KEY);
  var stuck = false;

  function poolKey(key){ return key === null ? "_all" : key; }
  function canGenerate(){ return !!sampleFn && !samplingOff; }

  function factsFromBatches(batches){
    var out = [];
    batches.forEach(function(b){
      if(!b || !Array.isArray(b.facts)) return;
      b.facts.forEach(function(f, i){
        if(!f || !f.text) return;
        var entry = {
          id: "g:" + b.id + ":" + i,
          text: safeHtml(f.text),
          deep: safeHtml(f.deep || ""),
          gen: true
        };
        if(b.place){ entry.tag = "place"; entry.place = b.place; }
        else { entry.tag = "general"; }
        out.push(entry);
      });
    });
    return out;
  }

  function rebuildGen(){
    genFacts = factsFromBatches(dbBatches).concat(factsFromBatches(localBatches));
    reindex();
    updateChips();
    updateProgress();
    if(stuck && unseenFacts().length){
      stuck = false;
      nextFact();
    }
  }

  function stripMarkup(s){
    return String(s).replace(/<[^>]*>/g, "").replace(/&[a-z]+;/g, " ").replace(/\s+/g, " ").trim();
  }

  function buildPrompt(key, count){
    var place = key ? placeByKey[key] : null;
    var subject;
    if(!place){
      subject = "the Netherlands as a whole, not tied to any one city or region";
    } else if(place.custom){
      subject = place.name + ", a place in the Netherlands";
    } else {
      subject = place.name + " (" + place.sub + "), in the Netherlands";
    }
    var needsSub = !!(place && place.custom && !place.sub);
    var existing = ALL
      .filter(function(f){ return key === null ? f.tag === "general" : f.place === key; })
      .map(function(f){ return "- " + stripMarkup(f.text).slice(0, 130); })
      .slice(-60)
      .join("\n");

    return [
      "You are writing new entries for a carefully curated almanac of facts about the Netherlands. Write " + count + " new entries about " + subject + ".",
      "",
      "House style, follow exactly:",
      "- Each entry has two fields: text and deep.",
      "- text: one or two sentences, 35 to 55 words, stating a single concrete and genuinely surprising fact.",
      "- deep: 60 to 90 words giving the fuller story behind it: the origin, the mechanism, the consequence, or a vivid specific detail.",
      "- Pitch it at a well-read person, including Dutch readers, who already knows the obvious things. No tulips-and-windmills cliches, nothing about clogs, nothing a first-time visitor learns on day one.",
      "- Favour mechanisms, origins, institutional quirks, water engineering, odd laws, and specific strangeness over scenic description.",
      "- State only what you are confident is true. If unsure of a name, date or number, write the entry without it rather than guessing.",
      "- Markup: <em> and </em> around Dutch or foreign terms, &mdash; for dashes, &ldquo; and &rdquo; for quotation marks. No other HTML, no markdown.",
      "- Do not repeat, paraphrase or overlap with any existing entry listed below.",
      "",
      existing ? "Existing entries, do not repeat or restate these:\n" + existing : "",
      "",
      (place && place.custom
        ? "If the name above is not a recognizable place in the Netherlands, or you cannot tell what it refers to, reply with only {\"notInCountry\":true} and no entries.\n"
        : ""),
      "Reply with only JSON in exactly this shape:",
      (needsSub
        ? "{\"sub\":\"the province it is in\",\"facts\":[{\"text\":\"...\",\"deep\":\"...\"}]}"
        : "{\"facts\":[{\"text\":\"...\",\"deep\":\"...\"}]}")
    ].join("\n");
  }

  function storeBatch(key, facts){
    var place = key || "";
    if(genCollection){
      return genCollection.add({ place: place, facts: facts, createdAt: new Date().toISOString() });
    }
    localBatches.push({ id: "local-" + Date.now(), place: place, facts: facts });
    writeLocal(GEN_KEY, localBatches);
    rebuildGen();
    return Promise.resolve();
  }

  function generateFor(key){
    var pk = poolKey(key);
    if(!canGenerate() || genBusy[pk]) return;
    genBusy[pk] = true;
    genFailed[pk] = null;
    updateProgress();

    var place = key ? placeByKey[key] : null;
    var firstRun = !!(place && place.custom && !place.sub);

    sampleFn.json(buildPrompt(key, 8), { modelTier: "default", cache: false })
      .then(function(data){
        if(data && data.notInCountry){ return Promise.reject({ code: "not_in_country" }); }
        var list = (data && Array.isArray(data.facts)) ? data.facts : [];
        var cleaned = [];
        list.forEach(function(item){
          if(item && typeof item.text === "string" && item.text.trim()){
            cleaned.push({ text: item.text.trim(), deep: typeof item.deep === "string" ? item.deep.trim() : "" });
          }
        });
        if(!cleaned.length){ return Promise.reject({ code: "empty_completion" }); }
        if(place && place.custom && !place.sub && typeof data.sub === "string" && data.sub.trim()){
          place.sub = data.sub.trim().slice(0, 24);
          savePlaces();
          applyPlaces();
        }
        return storeBatch(key, cleaned);
      })
      .then(function(){
        genBusy[pk] = false;
        if(firstRun && place){ addNoteSay(place.name + " added, with its first facts.", false); }
        updateChips();
        updateProgress();
      })
      ["catch"](function(e){
        genBusy[pk] = false;
        var code = (e && e.code) || "upstream_error";
        if(code === "not_in_country"){
          if(place && place.custom){
            addNoteSay("Couldn't place " + place.name + " in the Netherlands — check the spelling and try again.", true);
            removePlace(place.key);
            return;
          }
        }
        if(code === "not_granted" || code === "sampling_disabled" || code === "not_declared" ||
           code === "capability_disabled" || code === "capability_removed"){
          samplingOff = true;
        } else {
          genFailed[pk] = code;
        }
        if(firstRun && place){
          addNoteSay("Added " + place.name + ", but writing its facts didn't work just now.", true);
        }
        updateProgress();
      });
  }

  // ---- Places you add yourself ----
  var placesDoc = null;

  function savePlaces(){
    writeLocal(PLACES_KEY, customPlaces);
    if(placesDoc){ placesDoc.set({ items: customPlaces })["catch"](function(){}); }
  }

  function applyPlaces(){
    rebuildPlaces();
    buildChips();
    if(!filter && validFilter(storedFilter)){ filter = storedFilter; }
    if(filter && !validFilter(filter)){ filter = null; }
    updateChips();
    updateProgress();
    updateRemoveBtn();
  }

  function updateRemoveBtn(){
    var p = filter ? placeByKey[filter] : null;
    removePlaceBtn.hidden = !(p && p.custom);
  }

  function slugFor(name){
    var base = "c:" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    if(base === "c:"){ base = "c:place"; }
    var key = base, n = 2;
    while(placeByKey[key]){ key = base + "-" + n; n++; }
    return key;
  }

  function addNoteSay(msg, bad){
    addNote.textContent = msg || "";
    addNote.classList.toggle("bad", !!bad);
    addNote.hidden = !msg;
  }

  function addPlace(rawName){
    var name = rawName.replace(/\s+/g, " ").trim();
    if(!name) return;
    if(name.length > 40){ name = name.slice(0, 40); }

    var existing = null;
    PLACES.forEach(function(p){
      if(p.name.toLowerCase() === name.toLowerCase()){ existing = p; }
    });
    if(existing){
      addNoteSay(existing.name + " is already on the list.", false);
      setFilter(existing.key);
      return;
    }
    if(!canGenerate()){
      addNoteSay("Adding a place needs Claude to write its facts, which isn't available here.", true);
      return;
    }

    var place = { key: slugFor(name), name: name, sub: "", custom: true };
    customPlaces.push(place);
    savePlaces();
    applyPlaces();
    addPlaceInput.value = "";
    addNoteSay("Writing the first facts about " + place.name + "…", false);
    setFilter(place.key);
  }

  function removePlace(key){
    customPlaces = customPlaces.filter(function(p){ return p.key !== key; });
    savePlaces();
    if(filter === key){ filter = null; }
    try{ window.localStorage.removeItem(FILTER_KEY); } catch(e){ /* ignore */ }
    storedFilter = null;
    applyPlaces();
    addNoteSay("Removed. Facts already written for it stay in Everything.", false);
    var f = pickFact();
    if(f){ visit(f); }
  }

  function maybeTopUp(threshold){
    if(!canGenerate()) return;
    if(genFailed[poolKey(filter)]) return;
    if(unseenFacts().length > threshold) return;
    generateFor(filter);
  }

  function buildChips(){
    chipsEl.innerHTML = "";
    CHIPS.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = c.custom ? "chip custom" : "chip";
      b.setAttribute("data-key", c.key === null ? "" : c.key);
      var n = document.createElement("span");
      n.className = "chip-name";
      n.textContent = c.name;
      b.appendChild(n);
      if(c.sub){
        var s = document.createElement("span");
        s.className = "chip-sub";
        s.textContent = c.sub;
        b.appendChild(s);
      }
      b.addEventListener("click", function(){ setFilter(c.key); });
      chipsEl.appendChild(b);
    });
  }
  buildChips();

  function updateChips(){
    var nodes = chipsEl.querySelectorAll(".chip");
    for(var i=0;i<nodes.length;i++){
      var key = nodes[i].getAttribute("data-key") || null;
      var active = key === filter;
      nodes[i].classList.toggle("active", active);
      nodes[i].classList.toggle("done", unseenCountFor(key) === 0);
      nodes[i].setAttribute("aria-pressed", active ? "true" : "false");
    }
    corpusCount.textContent = ALL.length + " facts";
  }

  function updateProgress(){
    var total = poolFacts().length;
    var left = unseenFacts().length;
    var pk = poolKey(filter);
    var writing = !!genBusy[pk];
    progressEl.textContent = (total - left) + " of " + total + " read · " + filterLabel() +
      (writing ? " · writing more" : "");

    var done = left === 0;
    btn.disabled = done;
    exhaustedEl.hidden = !done;
    if(!done) return;

    var label = filterLabel();
    if(writing){
      exhaustedText.textContent = "That's every fact in " + label + ". Claude is writing more now — usually under a minute.";
    } else if(genFailed[pk] === "rate_limited"){
      exhaustedText.textContent = "That's every fact in " + label + ". New ones couldn't be written just now: your Claude usage limit was reached.";
    } else if(genFailed[pk]){
      exhaustedText.textContent = "That's every fact in " + label + ". Writing new ones didn't work just now.";
    } else if(canGenerate()){
      exhaustedText.textContent = "That's every fact in " + label + ". More are on the way.";
    } else {
      exhaustedText.textContent = "You've read every fact in " + label + ". Nothing repeats until you reset this set.";
    }
    retryBtn.hidden = !(canGenerate() && !writing && genFailed[pk]);
  }

  function setFilter(key){
    filter = key;
    try{
      if(key === null){ window.localStorage.removeItem(FILTER_KEY); }
      else { window.localStorage.setItem(FILTER_KEY, key); }
    } catch(e){ /* ignore */ }
    updateChips();
    updateProgress();
    updateRemoveBtn();
    var fact = pickFact();
    if(fact){ visit(fact); }
    else { stuck = true; maybeTopUp(2); }
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  (function setDatebar(){
    var opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    document.getElementById("datebar").textContent = new Date().toLocaleDateString('en-GB', opts);
  })();

  function pickFact(){
    var pool = unseenFacts();
    if(!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function updateKeepBtn(){
    var isKept = current && keptIds.indexOf(current.id) !== -1;
    keepBtn.classList.toggle("kept", !!isKept);
    keepBtn.setAttribute("aria-pressed", isKept ? "true" : "false");
    keepLabel.textContent = isKept ? "Kept" : "Keep this one";
  }

  function renderSavedList(){
    savedToggle.textContent = "Kept facts (" + keptIds.length + ")";
    savedList.innerHTML = "";
    if(keptIds.length === 0){
      var empty = document.createElement("p");
      empty.className = "saved-empty";
      empty.textContent = "Nothing kept yet. The box under a fact saves it here.";
      savedList.appendChild(empty);
      return;
    }
    keptIds.forEach(function(id){
      var fact = factById[id];
      if(!fact) return;
      var row = document.createElement("div");
      row.className = "saved-item";

      var txt = document.createElement("button");
      txt.type = "button";
      txt.className = "txt";
      txt.innerHTML = fact.text;
      txt.addEventListener("click", function(){ visit(fact); window.scrollTo({top:0, behavior:"smooth"}); });

      var rm = document.createElement("button");
      rm.type = "button";
      rm.className = "rm";
      rm.setAttribute("aria-label","Remove from kept facts");
      rm.textContent = "×";
      rm.addEventListener("click", function(){
        keptIds = keptIds.filter(function(n){ return n !== id; });
        saveKept();
        renderSavedList();
        updateKeepBtn();
      });

      row.appendChild(txt);
      row.appendChild(rm);
      savedList.appendChild(row);
    });
  }

  function closeStory(){
    deepWrap.classList.remove("open");
    storyBtn.setAttribute("aria-expanded", "false");
    storyLabel.textContent = "Read the full story";
  }

  function pad(n){ return n < 10 ? "00" + n : (n < 100 ? "0" + n : "" + n); }

  function render(fact){
    current = fact;
    factEl.innerHTML = fact.text;
    freshTag.hidden = !fact.gen;
    indexTag.innerHTML = "&numero; " + (typeof fact.id === "number" ? pad(fact.id + 1) : "NEW");
    updateKeepBtn();
    deepText.innerHTML = '<span class="cap">The fuller story</span>' + (fact.deep || "");
    closeStory();

    if(fact.tag === "general"){
      placeTag.innerHTML = "Across the Netherlands";
    } else {
      var place = placeByKey[fact.place];
      if(place){
        placeTag.innerHTML = place.name + (place.sub ? ' <span class="sub">' + place.sub + '</span>' : "");
      } else {
        placeTag.innerHTML = "Somewhere in the Netherlands";
      }
    }
  }

  var trail = [];
  var cursor = -1;

  function updateNav(){
    backBtn.disabled = cursor <= 0;
    fwdBtn.disabled = cursor >= trail.length - 1;
  }

  function visit(fact){
    trail = trail.slice(0, cursor + 1);
    trail.push(fact);
    if(trail.length > 100){ trail.shift(); }
    cursor = trail.length - 1;
    render(fact);
    updateNav();
    if(seenIds.indexOf(fact.id) === -1){
      seenIds.push(fact.id);
      saveSeen(false);
      updateChips();
    }
    updateProgress();
    maybeTopUp(2);
  }

  function step(delta){
    var target = cursor + delta;
    if(target < 0 || target >= trail.length) return;
    cursor = target;
    render(trail[cursor]);
    updateNav();
  }

  function nextFact(){
    var fact = pickFact();
    if(!fact){ stuck = true; maybeTopUp(2); updateProgress(); return; }
    visit(fact);
  }

  btn.addEventListener("click", nextFact);
  backBtn.addEventListener("click", function(){ step(-1); });
  fwdBtn.addEventListener("click", function(){ step(1); });

  document.addEventListener("keydown", function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if(e.key === "ArrowLeft"){ step(-1); }
    else if(e.key === "ArrowRight"){ step(1); }
  });

  keepBtn.addEventListener("click", function(){
    if(!current) return;
    var idx = keptIds.indexOf(current.id);
    if(idx === -1){ keptIds.push(current.id); }
    else { keptIds.splice(idx, 1); }
    saveKept();
    updateKeepBtn();
    renderSavedList();
  });

  storyBtn.addEventListener("click", function(){
    var willOpen = !deepWrap.classList.contains("open");
    deepWrap.classList.toggle("open", willOpen);
    storyBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
    storyLabel.textContent = willOpen ? "Close the story" : "Read the full story";
  });

  savedToggle.addEventListener("click", function(){
    savedPanel.hidden = !savedPanel.hidden;
    if(!savedPanel.hidden){ renderSavedList(); }
  });

  retryBtn.addEventListener("click", function(){ generateFor(filter); });

  addPlaceForm.addEventListener("submit", function(e){
    e.preventDefault();
    addPlace(addPlaceInput.value);
  });

  removePlaceBtn.addEventListener("click", function(){
    var p = filter ? placeByKey[filter] : null;
    if(p && p.custom){ removePlace(p.key); }
  });

  resetBtn.addEventListener("click", function(){
    var poolIds = poolFacts().map(function(f){ return f.id; });
    seenIds = seenIds.filter(function(id){ return poolIds.indexOf(id) === -1; });
    saveSeen(true);
    updateChips();
    nextFact();
  });

  // opening state
  applyPlaces();
  rebuildGen();
  var opening = pickFact();
  if(opening){ visit(opening); }
  else { stuck = true; updateProgress(); }
  renderSavedList();

  var syncNote = document.getElementById("syncNote");
  var firstKept = true;
  var firstSeen = true;

  function union(a, b){
    var out = a.slice();
    b.forEach(function(id){ if(out.indexOf(id) === -1){ out.push(id); } });
    return out;
  }

  function adoptKept(serverIds){
    if(firstKept){
      firstKept = false;
      var merged = union(serverIds, keptIds);
      keptIds = merged;
      writeLocal(KEPT_KEY, keptIds);
      if(merged.length !== serverIds.length){ push("kept"); }
    } else {
      keptIds = serverIds;
      writeLocal(KEPT_KEY, keptIds);
    }
    renderSavedList();
    updateKeepBtn();
  }

  function adoptSeen(serverIds){
    if(firstSeen){
      firstSeen = false;
      var merged = union(serverIds, seenIds);
      seenIds = merged;
      writeLocal(SEEN_KEY, seenIds);
      if(merged.length !== serverIds.length){ push("seen"); }
    } else {
      seenIds = serverIds;
      writeLocal(SEEN_KEY, seenIds);
    }
    updateChips();
    updateProgress();
  }

  (function connectStore(){
    if(!(window.claude && window.claude.use)) return;

    Promise.resolve(window.claude.use("sample")).then(function(s){
      sampleFn = s || null;
      updateProgress();
      maybeTopUp(0);
    })["catch"](function(){});

    Promise.resolve(window.claude.use("db")).then(function(db){
      if(!db) return;
      docs.kept = db.doc("kept/list");
      docs.seen = db.doc("progress/seen");
      genCollection = db.collection("generated");
      placesDoc = db.doc("places/custom");

      placesDoc.onSnapshot(function(snap){
        var body = snap.exists ? snap.data() : null;
        var items = (body && Array.isArray(body.items)) ? body.items : [];
        var clean = [];
        items.forEach(function(p){
          if(p && typeof p.key === "string" && typeof p.name === "string" && p.key.indexOf("c:") === 0){
            clean.push({
              key: p.key,
              name: String(p.name).slice(0, 40),
              sub: typeof p.sub === "string" ? p.sub.slice(0, 24) : "",
              custom: true
            });
          }
        });
        var folded = false;
        customPlaces.forEach(function(local){
          var known = clean.some(function(p){ return p.key === local.key; });
          if(!known){ clean.push(local); folded = true; }
        });
        customPlaces = clean;
        writeLocal(PLACES_KEY, customPlaces);
        if(folded){ placesDoc.set({ items: customPlaces })["catch"](function(){}); }
        applyPlaces();
      }, function(){ placesDoc = null; });

      genCollection.onSnapshot(function(snap){
        dbBatches = snap.docs.map(function(d){
          var body = d.data() || {};
          return {
            id: d.id,
            place: typeof body.place === "string" ? body.place : "",
            facts: Array.isArray(body.facts) ? body.facts : []
          };
        });
        rebuildGen();
      }, function(){ genCollection = null; });

      syncNote.textContent = "Kept facts, progress and newly written facts follow you across devices";
      syncNote.classList.add("synced");

      function lost(){
        syncNote.textContent = "Kept facts and progress are saved on this iPhone";
        syncNote.classList.remove("synced");
        docs.kept = null;
        docs.seen = null;
      }

      docs.kept.onSnapshot(function(snap){
        var body = snap.exists ? snap.data() : null;
        adoptKept((body && Array.isArray(body.ids)) ? body.ids.filter(validId) : []);
      }, lost);

      docs.seen.onSnapshot(function(snap){
        var body = snap.exists ? snap.data() : null;
        adoptSeen((body && Array.isArray(body.ids)) ? body.ids.filter(validId) : []);
      }, lost);
    })["catch"](function(){});
  })();
})();
</script>

</body></html>
