name: Radar tasks
# Radar's research tasks, run by Claude Code on GitHub (they used to be Claude cloud routines):
#   daily     every morning ~06:52 Amsterdam: feedback, Do ideas, feed, work, bucket list
#   inbox     hourly, only when the phone sent a city, interest or bucket note (otherwise no Claude run)
#   finds     08:10: second-hand ads for the wanted list (opens marketplace pages, no web searches)
#   concerts  Sundays 18:47: new shows by the alert artists
#   work      Tuesdays and Fridays 08:40: freelance and work leads (instructions in task.py, sources kept in interests)
# GitHub sometimes skips scheduled runs: the hourly run then catches up a daily, finds or work run that
# didn't happen (radar/last-run.json holds the date each task last ran).
# Cost: on the API key every run uses Haiku with a search allowance, a cap per run and a monthly budget
# (radar/tools/task.py, RADAR_BUDGET_USD, spend in radar/spend.json). With CLAUDE_CODE_OAUTH_TOKEN (the
# owner's subscription) nothing is billed per use and the task's own model runs.
# Privacy (this repo and its Actions logs are public):
# - Claude never gets the passphrase or a GitHub token. radar/tools/task.py unlocks the data into the
#   git-ignored radar/.plain/ before Claude runs, and encrypts, commits and closes notes afterwards.
# - The instructions are encrypted in the vault (radar/data/tasks.enc.json) because they hold personal details.
# - Claude's output goes to a file in the runner's temp folder, never to the log; the log shows counts only.
#   The final message goes to the phone via ntfy (topic from the NTFY_TOPIC secret or interests.alerts.ntfy).
# Secrets: PK (or RADAR_KEY) = the passphrase; ANTHROPIC_API_KEY (or PK2, or CLAUDE_CODE_OAUTH_TOKEN) for Claude.
on:
  schedule:
    - cron: "52 5 * * *"        # daily
    - cron: "38 * * * *"        # inbox
    - cron: "10 7 * * *"        # finds
    - cron: "47 17 * * 0"       # concerts
    - cron: "40 7 * * 2,5"      # work
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        type: choice
        options: [daily, inbox, finds, concerts, work]
        default: inbox
permissions:
  contents: write
  issues: write
concurrency:
  group: radar-data
  cancel-in-progress: false
jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no GitHub token in .git for Claude to find
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the task
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.task }}
        run: |
          case "$SCHEDULE" in
            "52 5 * * *") t=daily ;;
            "10 7 * * *") t=finds ;;
            "47 17 * * 0") t=concerts ;;
            "40 7 * * 2,5") t=work ;;
            "38 * * * *") t=inbox ;;
            *) t="$INPUT" ;;
          esac
          if [ "$t" = inbox ]; then
            # catch up a scheduled run GitHub skipped today (daily from 06 UTC, finds from 08, work Tue/Fri from 09)
            last() { python3 -c "import json,sys;print(json.load(open('radar/last-run.json')).get(sys.argv[1],''))" "$1" 2>/dev/null; }
            today=$(date -u +%F); h=$((10#$(date -u +%H))); dow=$(date -u +%u)
            if [ "$h" -ge 6 ] && [ "$(last daily)" != "$today" ]; then t=daily
            elif [ "$h" -ge 8 ] && [ "$(last finds)" != "$today" ]; then t=finds
            elif [ "$h" -ge 9 ] && { [ "$dow" = 2 ] || [ "$dow" = 5 ]; } && [ "$(last work)" != "$today" ]; then t=work
            fi
          fi
          case "$t" in daily|inbox|finds|concerts|work) ;; *) echo "unknown task"; exit 1 ;; esac
          echo "task=$t" >> "$GITHUB_OUTPUT"
          echo "radar-task: $t"
      - name: Unlock and gather notes
        id: prep
        env:
          PK: ${{ secrets.PK || secrets.RADAR_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SUBSCRIPTION: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          RADAR_BUDGET_USD: ${{ vars.RADAR_BUDGET_USD }}
        run: python3 radar/tools/task.py prepare "${{ steps.pick.outputs.task }}"
      - name: Claude
        if: steps.prep.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.PK2 }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ steps.prep.outputs.model }}
          CAP: ${{ steps.prep.outputs.cap }}
          NOSEARCH: ${{ steps.prep.outputs.nosearch }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          # Prefer the subscription token (no per-use billing) over the API key when both are set.
          [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset ANTHROPIC_API_KEY
          if [ -z "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "radar-task: no Claude key: add the ANTHROPIC_API_KEY secret"; exit 1
          fi
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          extra=()
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            touch "$RUNNER_TEMP/billed"
            [ -z "$CAP" ] || extra+=(--max-budget-usd "$CAP")
            [ "$NOSEARCH" != "true" ] || extra+=(--disallowedTools WebSearch)
          fi
          set +e
          claude -p --model "$MODEL" --output-format json --dangerously-skip-permissions "${extra[@]}" \
            < "$RUNNER_TEMP/prompt.txt" > "$RUNNER_TEMP/out.json" 2> "$RUNNER_TEMP/claude.err"
          echo "radar-task: Claude finished (exit $?)"
      - name: Save, close notes, notify
        if: always() && steps.prep.outputs.run == 'true'
        env:
          PK: ${{ secrets.PK || secrets.RADAR_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CAP: ${{ steps.prep.outputs.cap }}
          RADAR_BUDGET_USD: ${{ vars.RADAR_BUDGET_USD }}
        run: python3 radar/tools/task.py finish "${{ steps.pick.outputs.task }}"
      - name: Wipe
        if: always()
        run: rm -rf radar/.plain "$RUNNER_TEMP/billed" "$RUNNER_TEMP/snap.json" "$RUNNER_TEMP/out.json" "$RUNNER_TEMP/prompt.txt" "$RUNNER_TEMP/claude.err"
