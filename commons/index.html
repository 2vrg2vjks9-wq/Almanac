<style>
  /* Layout: one phone-width column, a drawn landscape up top, a share wheel as the signature mark, tabs at the bottom. */
  :root{
    --paper:#e9eee9;
    --paper-2:#dde5df;
    --card:#f7f9f6;
    --ink:#15211c;
    --soft:#4a5a52;
    --muted:#77867e;
    --line:rgba(21,33,28,.13);
    --accent:#2b47b5;
    --accent-ink:#f7f9f6;
    --share:#e3a41f;
    --share-ink:#2a1d00;
    --good:#2f7d4f;
    --warn:#b8541d;
    --sky1:#cfe0ea; --sky2:#f3e7cf; --sun:#f3c35a;
    --land1:#9db7a4; --land2:#6d8f78; --land3:#3f5f4c;
    --sea1:#7fa9c2; --sea2:#4d7c99; --snow:#ffffff; --hull:#1f2d3a; --glow:#ffd36b;
    --display:'Gloock','Iowan Old Style',Georgia,serif;
    --body:'Figtree','Avenir Next','Segoe UI',system-ui,sans-serif;
    --mono:'Spline Sans Mono','SF Mono',Menlo,Consolas,monospace;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0f1513; --paper-2:#151d1a; --card:#18211e; --ink:#e5ece6; --soft:#a5b3ab; --muted:#6f7f77;
      --line:rgba(229,236,230,.12); --accent:#93a8ff; --accent-ink:#0f1513; --share:#f0b93a; --share-ink:#241800;
      --good:#6fcf92; --warn:#f08a54;
      --sky1:#1b2740; --sky2:#3b3150; --sun:#f6d78a;
      --land1:#2c3d38; --land2:#20302b; --land3:#15211d;
      --sea1:#24405a; --sea2:#172e44; --snow:#cfd8e6; --hull:#0b1118; --glow:#ffc94d;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f1513; --paper-2:#151d1a; --card:#18211e; --ink:#e5ece6; --soft:#a5b3ab; --muted:#6f7f77;
    --line:rgba(229,236,230,.12); --accent:#93a8ff; --accent-ink:#0f1513; --share:#f0b93a; --share-ink:#241800;
    --good:#6fcf92; --warn:#f08a54;
    --sky1:#1b2740; --sky2:#3b3150; --sun:#f6d78a;
    --land1:#2c3d38; --land2:#20302b; --land3:#15211d;
    --sea1:#24405a; --sea2:#172e44; --snow:#cfd8e6; --hull:#0b1118; --glow:#ffc94d;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
  .wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
  h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
  h1{font-size:2.1rem}
  h2{font-size:1.55rem}
  h3{font-size:1.15rem}
  p{margin:0}
  .eyebrow{font:600 .72rem/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .soft{color:var(--soft)}
  .stack{display:flex;flex-direction:column;gap:14px}
  .stack-l{display:flex;flex-direction:column;gap:28px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* top bar */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
  .mark{display:flex;align-items:center;gap:10px;min-width:0}
  .mark b{font:400 1.25rem/1 var(--display);white-space:nowrap}
  .plan-pick{min-width:0;max-width:52%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.88rem}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn.share{background:var(--share);color:var(--share-ink);border-color:transparent}
  .btn.small{padding:6px 12px;font-size:.85rem}
  .btn.ghost{background:transparent}
  .btn:active{transform:translateY(1px)}

  /* hero */
  .hero{position:relative;border-radius:20px;overflow:hidden;background:var(--sky1);aspect-ratio:4/3;max-width:100%}
  .hero canvas{display:block;width:100%;height:100%}
  .hero .wheel{position:absolute;right:12px;top:12px;width:74px;height:74px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
  .hero-text{display:flex;flex-direction:column;gap:6px}
  .title-edit{font:400 2rem/1.1 var(--display);border:0;background:transparent;padding:0;width:100%;border-bottom:1px dashed transparent}
  .title-edit:focus{border-bottom-color:var(--line);outline:none}
  .place-edit{border:0;background:transparent;padding:0;color:var(--soft);width:100%}
  .place-edit:focus{outline:none;border-bottom:1px dashed var(--line)}

  /* the three headline figures */
  .figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .fig{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px}
  .fig b{display:block;font:500 1.3rem/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  .fig span{font-size:.78rem;color:var(--soft);line-height:1.3;display:block;margin-top:4px}
  .fig.key{background:var(--share);border-color:transparent;color:var(--share-ink)}
  .fig.key span{color:var(--share-ink);opacity:.8}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .note{font-size:.88rem;color:var(--soft)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* barrier list */
  .barriers{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
  .barrier{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding-block:12px;border-bottom:1px solid var(--line);align-items:center}
  .barrier b{font-weight:600}
  .barrier p{grid-column:1/2;font-size:.9rem;color:var(--soft)}
  .barrier button{grid-row:1/3;grid-column:2}

  .templates{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tpl{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column}
  .tpl canvas{width:100%;aspect-ratio:16/10;display:block}
  .tpl div{padding:10px 12px 12px}
  .tpl b{display:block;font-weight:600}
  .tpl span{font-size:.8rem;color:var(--soft)}

  .shows{display:flex;flex-direction:column;gap:10px}
  .show{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
  .show .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:500 .8rem var(--mono);background:var(--paper-2);color:var(--soft)}
  .show b{font-weight:600}
  .show p{font-size:.9rem;color:var(--soft)}

  /* numbers */
  .sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4;background:var(--paper);padding-block:6px 10px}
  .group{display:flex;flex-direction:column;gap:12px}
  .group h3{font-size:1.05rem}
  .field{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:4px 12px;align-items:center}
  .field label{font-size:.92rem}
  .field .hint{grid-column:1/3;font-size:.78rem;color:var(--muted);margin-top:-2px}
  .field input[type=number]{width:110px;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .field input[type=range]{grid-column:1/3;width:100%;accent-color:var(--accent);margin:0}
  .outcome{display:flex;flex-direction:column;gap:10px}
  .line{display:flex;justify-content:space-between;gap:12px;font-size:.95rem;padding-block:6px;border-bottom:1px dashed var(--line)}
  .line span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  .line.total{border-bottom:0;font-weight:700}
  .chart{width:100%;height:auto;display:block}
  .legend{display:flex;gap:16px;font-size:.82rem;color:var(--soft);flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

  /* pitch */
  .msg{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-size:.98rem;line-height:1.55;overflow-wrap:anywhere}
  .txt{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
  textarea.txt{min-height:72px;resize:vertical}
  .angle{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left}
  .angle[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .angle b{font-weight:600}
  .angle span{font-size:.82rem;color:var(--soft)}
  .angles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}

  /* crew */
  .crew-head{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
  .crew-head svg{width:120px;height:120px}
  .member{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-block:12px;border-bottom:1px solid var(--line)}
  .member b{font-weight:600;overflow-wrap:anywhere}
  .member .meta{grid-column:1/2;font-size:.85rem;color:var(--soft)}
  .member .tools{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
  .pill{display:inline-block;font:600 .7rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 8px;margin-left:6px;vertical-align:2px}
  .pill.in{background:var(--share);color:var(--share-ink)}
  .pill.maybe{background:transparent;border:1px solid var(--share);color:var(--soft)}
  .pill.no{background:var(--paper-2);color:var(--muted)}
  .ok{color:var(--good)} .low{color:var(--warn)}
  .form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--soft);min-width:0}
  .form label.full{grid-column:1/3}
  .form input,.form select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;color:var(--ink);width:100%;min-width:0}

  /* path */
  .steps{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:15px}
  .step{position:relative;padding:0 0 22px 26px}
  .step .tick{position:absolute;left:-17px;top:0;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;font:600 .85rem var(--mono);cursor:pointer;color:var(--soft)}
  .step.done .tick{background:var(--good);border-color:var(--good);color:var(--paper)}
  .step summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px;padding-top:3px}
  .step summary::-webkit-details-marker{display:none}
  .step summary b{font-weight:600;font-size:1.02rem}
  .step summary span{font-size:.86rem;color:var(--soft)}
  .step .body{display:flex;flex-direction:column;gap:10px;padding-top:10px;font-size:.93rem}
  .step ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
  .rules{display:flex;flex-direction:column;gap:10px}
  .rules label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--soft)}
  .rules select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;color:var(--ink);width:100%}
  .draft-order{counter-reset:o;display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
  .draft-order li{display:flex;gap:10px;font-size:.92rem}
  .draft-order li b{font-family:var(--mono);color:var(--muted);min-width:5.5em}

  /* tabs */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tabs div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  .tabs button{border:0;background:transparent;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-current="page"]{color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;transition:.25s;z-index:20;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .join-banner{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
  .join-banner .eyebrow{color:var(--accent-ink);opacity:.8}
  .confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem}
  .foot{font-size:.8rem;color:var(--muted);text-align:center}

  @media (max-width:380px){
    .figs{grid-template-columns:1fr 1fr}
    .figs .fig.key{grid-column:1/3}
    .crew-head{grid-template-columns:96px minmax(0,1fr)}
    .crew-head svg{width:96px;height:96px}
    .form{grid-template-columns:1fr}
    .form label.full{grid-column:auto}
  }
  @media (prefers-reduced-motion: reduce){ .toast{transition:none} }

  /* shared-commons additions */
  .mode{font:600 .68rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 9px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
  .mode.shared{background:var(--share);color:var(--share-ink);border-color:transparent}
  .stage{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar{flex:1 1 160px;height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden;min-width:120px}
  .bar i{display:block;height:100%;background:var(--share);border-radius:99px}
  .things{display:flex;flex-direction:column;gap:12px}
  .thing{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .thing canvas{width:112px;height:100%;min-height:96px;display:block}
  .thing > div{padding:10px 12px 10px 0;display:flex;flex-direction:column;gap:3px;min-width:0}
  .thing b{font:400 1.15rem/1.15 var(--display)}
  .thing span{font-size:.86rem;color:var(--soft)}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600}
  .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
  .status.busy::before{background:var(--share)}
  .av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font:600 .75rem var(--body);color:#fff;flex:none;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .who{display:flex;align-items:center;gap:8px;min-width:0}
  .who b{overflow-wrap:anywhere}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .cal .dow{font:600 .68rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
  .day{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 4px;font:500 .8rem var(--mono);text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);min-width:0;overflow:hidden}
  .day.past{opacity:.45}
  .day.today{outline:2px solid var(--accent);outline-offset:-2px}
  .day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .day .tag{font:600 .62rem/1 var(--body);border-radius:4px;padding:2px 3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day.blank{visibility:hidden}
  .calnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .calnav b{font:400 1.25rem var(--display)}
  table.money{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
  table.money th{font:600 .7rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.money th:first-child,table.money td:first-child{text-align:left;padding-left:0}
  table.money td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);white-space:nowrap}
  table.money td:first-child{font-family:var(--body);white-space:normal}
  .scroll{overflow-x:auto}
  .pos{color:var(--warn)} .neg{color:var(--good)}
  .log{display:flex;flex-direction:column}
  .log > div{padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .log small{color:var(--muted);font-size:.8rem}
  .issue{color:var(--warn);font-weight:600}
  .checks{display:flex;flex-direction:column;gap:8px}
  .checks label{display:flex;gap:10px;align-items:center;font-size:.93rem;color:var(--ink)}
  .checks input{width:20px;height:20px;accent-color:var(--good)}
  .empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:20px;border:1px dashed var(--line);border-radius:var(--r)}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .kv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:6px 12px;font-size:.92rem}
  .kv span:nth-child(even){font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  details.more > summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none}
  details.more > summary::-webkit-details-marker{display:none}
  details.more[open] > summary{margin-bottom:12px}
  .ro{font-size:.88rem;color:var(--soft);background:var(--paper-2);border-radius:10px;padding:10px 12px}
</style>

<header class="top wrap" style="padding-bottom:8px" id="top"></header>
<main class="wrap" id="view" style="padding-top:0"></main>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* The New Commons: a group of friends shares a cabin, a boat or a van the way a DEEL
   neighbourhood co-op shares cars. Book stays, log each stay, pay a monthly advance and

/* ---------- DOM helpers: text always goes in as text ---------- */
function h(tag, props){
  const el=document.createElement(tag);
  if(props) for(const k in props){
    const v=props[k];
    if(v==null || v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k==='style') el.style.cssText=v;
    else if(k.slice(0,2)==='on' && typeof v==='function') el.addEventListener(k.slice(2), v);
    else if(k==='value') el.value=v;
    else if(k==='checked') el.checked=!!v;
    else el.setAttribute(k, v===true?'':v);
  }
  for(let i=2;i<arguments.length;i++) add(el, arguments[i]);
  return el;
}
function add(el,c){ if(c==null||c===false) return; if(Array.isArray(c)){ c.forEach(x=>add(el,x)); return; } el.append(c.nodeType?c:document.createTextNode(String(c))); }
const SVGNS='http://www.w3.org/2000/svg';
function s(tag, attrs){ const el=document.createElementNS(SVGNS,tag); if(attrs) for(const k in attrs) el.setAttribute(k,attrs[k]); for(let i=2;i<arguments.length;i++){ const c=arguments[i]; if(c) el.append(c.nodeType?c:document.createTextNode(String(c))); } return el; }

function eur(x){ if(!isFinite(x)) return '–'; const r=Math.round(x); return (r<0?'−€':'€')+Math.abs(r).toLocaleString('nl-NL'); }
function int(x){ return isFinite(x)? Math.round(x).toLocaleString('nl-NL') : '–'; }
function clamp(x,a,b){ x=Number(x); if(!isFinite(x)) x=a; return Math.min(b,Math.max(a,x)); }
function txt(x,max){ return String(x==null?'':x).replace(/[\u0000-\u001f]/g,' ').slice(0,max||80); }

function nightsBetween(a,b){ const A=parse(a),B=parse(b); if(!A||!B) return 0; return Math.max(0, Math.round((B-A)/864e5)); }

/* ---------- money model (DEEL: advance on expected use, settle on real use) ---------- */
function fixedShare(){ return (rule('split').v)/100; }
function bufferPct(){ return rule('buffer').v/100; }
function activeMembers(){ return members().filter(m=>!m.left); }
function estOf(m,t){ return clamp((m.est||{})[t.id]||0,0,366); }
function advances(){
  const ms=activeMembers(), ts=things(), N=Math.max(1,ms.length), fp=fixedShare();
  const out={}; ms.forEach(m=>out[m.id]=0);
  ts.forEach(t=>{
    const F=Number(t.fixed)||0, tot=ms.reduce((a,m)=>a+estOf(m,t),0);
    ms.forEach(m=>{ out[m.id]+= F*fp/N + F*(1-fp)*(tot>0? estOf(m,t)/tot : 1/N); });
  });
  Object.keys(out).forEach(k=>out[k]*=(1+bufferPct()));
  return out;
}
function periodStart(){ const c=D.commons||{}; return c.period || c.trialStart || (c.created||'').slice(0,10) || today(); }
function usedNights(m, t, from, to){
  let n=0;
  list('bookings').forEach(b=>{
    if(b.member!==m.id || b.thing!==t.id) return;
    if(b.to>to || b.to<=from) return;              // only stays that ended in the period
    const trip=list('trips').find(x=>x.booking===b.id);
    n += trip? clamp(trip.nights,0,366) : nightsBetween(b.from,b.to);
  });
  return n;
}
function settlement(endDate){
  const from=periodStart(), to=endDate||today();
  const M=Math.max(0, monthsBetween(from,to));
  const ms=activeMembers(), ts=things(), N=Math.max(1,ms.length), fp=fixedShare(), adv=advances();
  const rows={}; ms.forEach(m=>rows[m.id]={id:m.id, nights:0, share:0, advance:adv[m.id]*M, spent:0});
  let total=0;
  ts.forEach(t=>{
    const ex=list('expenses').filter(e=>e.thing===t.id && e.date>=from && e.date<=to).reduce((a,e)=>a+Number(e.amount||0),0);
    const cost=(Number(t.fixed)||0)*M + ex; total+=cost;
    const used={}; let tot=0; ms.forEach(m=>{ used[m.id]=usedNights(m,t,from,to); tot+=used[m.id]; rows[m.id].nights+=used[m.id]; });
    ms.forEach(m=>{ rows[m.id].share += cost*fp/N + cost*(1-fp)*(tot>0? used[m.id]/tot : 1/N); });
  });
  list('expenses').filter(e=>e.date>=from && e.date<=to).forEach(e=>{ if(rows[e.paidBy]) rows[e.paidBy].spent+=Number(e.amount||0); });
  Object.values(rows).forEach(r=>{ r.balance = r.share - r.advance - r.spent; });
  return {from, to, months:M, total, rows};
}

/* ---------- buying numbers (kept from the first version) ---------- */
function calcBuy(t, people){
  const P=Math.max(1,Math.round(people));
  const own=t.price*t.own/100, buying=t.price*t.cost/100, loan=Math.max(0,t.price-own);
  const r=t.rate/100/12, n=Math.round(t.years*12);
  const pay= loan>0&&n>0 ? (r>0? loan*r/(1-Math.pow(1+r,-n)) : loan/n) : 0;
  const runM=t.run/12, rentM=t.rentNights*t.rentRate*(1-t.cut/100)/12;
  const netM=pay+runM-rentM, per=netM/P, up=(own+buying)/P;
  const nights=Math.max(0,t.season-t.rentNights)/P;
  let bal=loan, paid=up, value=t.price; const pts=[{y:0,paid:paid,worth:(t.price-loan)/P}];
  const g=Math.pow(1+t.growth/100,1/12);
  for(let m=1;m<=120;m++){ if(bal>0&&m<=n){ const i=bal*r; bal=Math.max(0,bal-(pay-i)); } value*=g; paid+=netM/P; if(m%12===0) pts.push({y:m/12,paid:paid,worth:(value-bal)/P}); }
  const end=pts[pts.length-1];
  return {P, pay, runM, rentM, netM, per, up, nights, pts, end, trueM:(end.paid-end.worth)/120};
}

/* ---------- scenes ---------- */
function rng(seed){ let x=0; for(const c of String(seed)) x=(x*31+c.charCodeAt(0))>>>0; return ()=>{ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; }
let SCENES=[];
function scene(cv,kind,seed){ SCENES.push([cv,kind,seed]); requestAnimationFrame(()=>drawScene(cv,kind,seed)); }
function drawScene(cv, kind, seed){
  const dpr=Math.min(2, window.devicePixelRatio||1);
  const w=cv.clientWidth||320, hh=cv.clientHeight||240;
  cv.width=Math.round(w*dpr); cv.height=Math.round(hh*dpr);
  const c=cv.getContext('2d'); if(!c) return;
  c.setTransform(dpr,0,0,dpr,0,0);
  const R=rng(seed+kind);
  const C={sky1:css('--sky1'),sky2:css('--sky2'),sun:css('--sun'),l1:css('--land1'),l2:css('--land2'),l3:css('--land3'),s1:css('--sea1'),s2:css('--sea2'),snow:css('--snow'),hull:css('--hull'),glow:css('--glow'),share:css('--share')};
  const sky=c.createLinearGradient(0,0,0,hh); sky.addColorStop(0,C.sky1); sky.addColorStop(1,C.sky2);
  c.fillStyle=sky; c.fillRect(0,0,w,hh);
  c.fillStyle=C.sun; c.beginPath(); c.arc(w*0.22,hh*0.3,Math.min(w,hh)*0.09,0,Math.PI*2); c.fill();
  function hill(y,amp,col,freq,ph){ c.fillStyle=col; c.beginPath(); c.moveTo(0,hh); for(let x=0;x<=w;x+=6) c.lineTo(x,y+Math.sin(x/w*Math.PI*freq+ph)*amp); c.lineTo(w,hh); c.closePath(); c.fill(); }
  function pine(x,base,ht,col){ c.fillStyle=col; c.beginPath(); c.moveTo(x,base-ht); c.lineTo(x-ht*0.28,base); c.lineTo(x+ht*0.28,base); c.closePath(); c.fill(); }
  function house(x,base,wd,col,roof){ c.fillStyle=col; c.fillRect(x,base-wd*0.6,wd,wd*0.6); c.fillStyle=roof; c.beginPath(); c.moveTo(x-wd*0.1,base-wd*0.6); c.lineTo(x+wd/2,base-wd*1.05); c.lineTo(x+wd*1.1,base-wd*0.6); c.closePath(); c.fill(); c.fillStyle=C.glow; c.fillRect(x+wd*0.22,base-wd*0.42,wd*0.2,wd*0.18); c.fillRect(x+wd*0.58,base-wd*0.42,wd*0.2,wd*0.18); }
  function sea(y){ const g=c.createLinearGradient(0,y,0,hh); g.addColorStop(0,C.s1); g.addColorStop(1,C.s2); c.fillStyle=g; c.fillRect(0,y,w,hh-y); c.strokeStyle=C.sky2; c.globalAlpha=.35; c.lineWidth=1.2; for(let i=0;i<9;i++){ const yy=y+8+i*(hh-y)/9, xx=R()*w; c.beginPath(); c.moveTo(xx,yy); c.lineTo(xx+20+R()*40,yy); c.stroke(); } c.globalAlpha=1; }
  if(kind==='cabin'){
    hill(hh*0.55,10,C.l1,2,1); for(let i=0;i<26;i++) pine(R()*w,hh*0.6+R()*8,28+R()*26,C.l2);
    hill(hh*0.74,6,C.l2,3,2); house(w*0.56,hh*0.8,Math.min(w*0.17,90),C.hull,C.l3);
    for(let i=0;i<14;i++){ const x=R()*w; if(Math.abs(x-w*0.62)<w*0.13) continue; pine(x,hh*0.84+R()*14,46+R()*40,C.l3); }
  } else if(kind==='beach'){
    sea(hh*0.55);
    c.fillStyle=C.share; c.beginPath(); c.moveTo(w*0.7,hh*0.18); c.lineTo(w*0.82,hh*0.12); c.lineTo(w*0.8,hh*0.22); c.closePath(); c.fill();
    c.strokeStyle=C.hull; c.lineWidth=.8; c.beginPath(); c.moveTo(w*0.76,hh*0.2); c.lineTo(w*0.5,hh*0.64); c.stroke();
    hill(hh*0.8,12,C.sky2,1.4,0.5);
    c.fillStyle=C.l1; c.globalAlpha=.6; for(let i=0;i<40;i++){ const x=R()*w; c.fillRect(x,hh*0.8-4-R()*10,1.5,8+R()*6); } c.globalAlpha=1;
    house(w*0.14,hh*0.84,Math.min(w*0.16,84),C.snow,C.hull);
  } else if(kind==='boat'){
    hill(hh*0.52,3,C.l2,2,0); sea(hh*0.56);
    const bx=w*0.5, by=hh*0.76, bw=Math.min(w*0.34,170);
    c.fillStyle=C.hull; c.beginPath(); c.moveTo(bx-bw/2,by); c.lineTo(bx+bw/2,by); c.lineTo(bx+bw*0.38,by+bw*0.13); c.lineTo(bx-bw*0.4,by+bw*0.13); c.closePath(); c.fill();
    c.fillStyle=C.snow; c.beginPath(); c.moveTo(bx,by-4); c.lineTo(bx,by-bw*0.95); c.lineTo(bx+bw*0.45,by-4); c.closePath(); c.fill();
    c.fillStyle=C.share; c.beginPath(); c.moveTo(bx-3,by-bw*0.8); c.lineTo(bx-3,by-4); c.lineTo(bx-bw*0.34,by-4); c.closePath(); c.fill();
  } else if(kind==='chalet'){
    c.fillStyle=C.l2; c.beginPath(); c.moveTo(0,hh*0.7);
    [[0.1,0.42],[0.3,0.2],[0.48,0.38],[0.66,0.14],[0.86,0.36],[1,0.3]].forEach(([x,y])=>c.lineTo(x*w,y*hh)); c.lineTo(w,hh*0.7); c.closePath(); c.fill();
    c.fillStyle=C.snow; [[0.3,0.2],[0.66,0.14]].forEach(([x,y])=>{ c.beginPath(); c.moveTo(x*w,y*hh); c.lineTo(x*w-w*0.06,y*hh+hh*0.1); c.lineTo(x*w+w*0.05,y*hh+hh*0.1); c.closePath(); c.fill(); });
    hill(hh*0.72,8,C.l1,2,1.5); for(let i=0;i<18;i++) pine(R()*w,hh*0.8+R()*10,22+R()*20,C.l3);
    hill(hh*0.88,4,C.snow,2,0.2); house(w*0.6,hh*0.9,Math.min(w*0.17,90),C.hull,C.l3);
  } else {
    hill(hh*0.58,14,C.l1,1.6,0.3); hill(hh*0.7,8,C.l2,2.4,1.2);
    c.fillStyle=C.l3; c.fillRect(0,hh*0.86,w,hh*0.14);

    const vx=w*0.36, vy=hh*0.86, vw=Math.min(w*0.32,150), vh=vw*0.46;
    c.fillStyle=C.snow; c.beginPath(); c.moveTo(vx,vy-8); c.lineTo(vx,vy-vh); c.lineTo(vx+vw*0.78,vy-vh); c.lineTo(vx+vw,vy-vh*0.5); c.lineTo(vx+vw,vy-8); c.closePath(); c.fill();

    c.fillStyle=C.hull; [0.2,0.78].forEach(f=>{ c.beginPath(); c.arc(vx+vw*f,vy-6,vh*0.15,0,Math.PI*2); c.fill(); });

function chart(c){

  const niceN=v=>{ const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,Math.abs(v))))); return Math.ceil(v/p)*p; };
  const top=niceN(maxV), bot=minV<0?-niceN(-minV):0;
  const X=y=>L+(W-L-Rr)*y/10, Y=v=>T+(H-T-B)*(1-(v-bot)/(top-bot));
  const svg=s('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':`After 10 years you put in ${eur(c.end.paid)} and your share is worth ${eur(c.end.worth)}`});
  [bot,bot+(top-bot)/2,top].forEach(t=>{ svg.append(s('line',{x1:L,x2:W-Rr,y1:Y(t),y2:Y(t),stroke:css('--line'),'stroke-width':1})); svg.append(s('text',{x:L-6,y:Y(t)+4,'text-anchor':'end','font-size':10,'font-family':'Spline Sans Mono, monospace',fill:css('--muted')}, Math.abs(t)>=1000? (t<0?'−':'')+'€'+Math.round(Math.abs(t)/1000)+'k' : eur(t))); });
  [0,5,10].forEach(y=>svg.append(s('text',{x:X(y),y:H-6,'text-anchor':'middle','font-size':10,'font-family':'Spline Sans Mono, monospace',fill:css('--muted')}, y===0?'now':'yr '+y)));
  const area='M'+pts.map(p=>X(p.y)+','+Y(p.paid)).join(' L')+' L'+pts.slice().reverse().map(p=>X(p.y)+','+Y(p.worth)).join(' L')+' Z';
  svg.append(s('path',{d:area,fill:css('--warn'),'fill-opacity':.1}));
  [['paid','--warn'],['worth','--accent']].forEach(([k,col])=>{ const d=pts.map((p,i)=>(i?'L':'M')+X(p.y).toFixed(1)+','+Y(p[k]).toFixed(1)).join(' '); svg.append(s('path',{d:d,fill:'none',stroke:css(col),'stroke-width':2.4,'stroke-linejoin':'round','stroke-linecap':'round'})); const e=pts[pts.length-1]; svg.append(s('circle',{cx:X(e.y),cy:Y(e[k]),r:4,fill:css(col)})); });
  return svg;
}
function rulesForm(editable){
  const c=D.commons;
  if(!c) return h('p',{class:'note',text:'Name your commons first.'});
  const box=h('div',{class:'rules'});
  Object.keys(RULES).forEach(k=>{
    if(!editable){ box.append(h('div',null,h('small',{class:'eyebrow',text:RULES[k].l}),h('div',{text:rule(k).text}))); return; }
    const sel=h('select',{id:'rule-'+k,onchange:async e=>{ const rules=Object.assign({},(D.commons||{}).rules,{[k]:Number(e.target.value)}); await put('commons','main',Object.assign({},D.commons,{rules:rules})); }});
    RULES[k].o.forEach((o,j)=>sel.append(h('option',{value:j,text:o,selected:rule(k).i===j?true:null})));
    box.append(h('label',null,RULES[k].l,sel));
  });
  const ms=members();
  return h('div',{class:'stack'}, box,
    h('p',{class:'note',text:`${ms.filter(m=>m.accepted).length} of ${ms.length} members accepted. Each member accepts on the Crew tab; members added by name can be marked there by the ambassador.`}),
    editable && MODE==='local'? h('div',null,h('button',{class:'btn small',type:'button',onclick:async()=>{ for(const m of ms.filter(m=>!m.accepted)) await put('members',m.id,Object.assign({},m,{accepted:true,acceptedOn:today()})); toast('Marked everyone as accepted'); }},'Everyone agreed in person')) : null);
}
function trialForm(editable){
  const c=D.commons;
  if(!c) return h('p',{class:'note',text:'Name your commons first.'});
  if(c.trialStart){
    const m=monthsBetween(c.trialStart,today());
    return h('div',{class:'stack'}, h('div',{class:'stage'}, h('span',{text:`Started ${nice(c.trialStart)} · ends ${nice(addDays(c.trialStart,182))}`}), h('div',{class:'bar'},h('i',{style:`width:${Math.min(100,Math.round(m/6*100))}%`}))),
      h('p',{class:'note',text:'At the end, settle up and decide together: become a co-op, change the set-up, or stop.'}));
  }
  if(!editable) return h('p',{class:'note',text:'Not started yet.'});
  const start=h('input',{type:'date',id:'trial-start',value:today()});
  return h('form',{class:'form',onsubmit:async ev=>{ ev.preventDefault(); if(!parse(start.value)){ toast('Pick a start date'); return; } if(await put('commons','main',Object.assign({},c,{stage:'trial',trialStart:start.value,period:start.value}))){ toast('Trial started'); if(MODE==='shared') render(); } }},
    h('label',null,'First day',start),
    h('div',{class:'row',style:'grid-column:1/-1'}, h('button',{class:'btn primary',type:'submit'},'Start the six-month trial')));
}
function coopForm(editable){
  const c=D.commons;
  const items=[
    'Settle up the trial and talk it through: who stays, who steps out, what to change.',
    'Sign a co-op or co-ownership agreement, ideally with a notary. Use the charter as the draft.',
    'Pick a board: at least a chair and a treasurer. The ambassador can be one of them.',
    'Open a shared bank account for the advances.',
    'Keep renting or leasing, or buy together. Open “Numbers” under each thing to compare.'
  ];
  return h('div',{class:'stack'}, h('ul',null, items.map(x=>h('li',{text:x}))),
    c && c.stage==='coop' ? h('p',{class:'ok',text:'You are a co-op. Well done.'}) :
    (editable && c ? h('div',null,h('button',{class:'btn',onclick:async()=>{ if(await put('commons','main',Object.assign({},c,{stage:'coop',coopSince:today()}))) toast('Congratulations, you’re a co-op'); }},'We signed: we’re a co-op')) : null));
}

/* ---------- boot ---------- */
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ SCENES.forEach(x=>{ if(x[0].isConnected) drawScene(x[0],x[1],x[2]); }); },200); });
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render()); }catch(e){}
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

async function resolveNames(){
  if(!USER) return;
  const ids=members().map(m=>m.uid).filter(Boolean);
  if(!ids.length) return;
  try{ const ps=await USER.profiles(ids); let changed=false; ids.forEach(id=>{ const p=ps[id]; if(p && (!NAMES[id] || NAMES[id].name!==p.name)){ NAMES[id]={name:p.name, color:p.color, avatarUrl:p.avatarUrl}; changed=true; } }); if(changed) queueRender(); }catch(e){}
}
async function startShared(db, user){
  DB=db; USER=user; MODE='shared';
  try{ MYID=user? await user.id() : null; }catch(e){}
  try{ const w=user? await user.can('data.write') : null; if(w===false) CANWRITE=false; }catch(e){}
  try{ ISADMIN=user? (await user.canEdit()) : false; }catch(e){ ISADMIN=false; }
  let answered=false;
  const timer=setTimeout(()=>{ if(!answered){ STALE=true; queueRender(); } },10000);
  const done=snap=>{ if(snap && snap.metadata && !snap.metadata.fromCache){ answered=true; clearTimeout(timer); if(STALE){ STALE=false; } } };
  const onErr=e=>{ answered=true; clearTimeout(timer); if(e && e.code==='revoked'){ CANWRITE=false; } queueRender(); };
  db.doc('commons/main').onSnapshot(snap=>{ D.commons=snap.exists? snap.data() : null; done(snap); queueRender(); }, onErr);
  COLLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{ o[d.id]=Object.assign({}, d.data(), {id:d.id}); }); D[c]=o; done(snap);
      if(c==='members') resolveNames();
      queueRender();
    }, onErr);
  });
  render();
}
function startLocal(){ MODE='local'; loadLocal(); render(); }
(async function boot(){
  render();
  const hasClaude = typeof window.claude==='object' && window.claude && typeof window.claude.use==='function';
  if(!hasClaude){ startLocal(); return; }
  let db=null, user=null;
  try{ [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){}
  if(db) startShared(db,user); else startLocal();
})();
})();
</script>
